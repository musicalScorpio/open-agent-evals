[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "A reproducible, framework-neutral benchmark laboratory for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Agent Reliability Lab contributors" }]
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
deepeval = ["deepeval>=3"]
langfuse = ["langfuse>=3"]

[project.entry-points."arlab.agent_adapters"]
# Third-party packages register agent adapter factories here.

[project.entry-points."arlab.evaluators"]
# Evaluation frameworks register evaluator factories here.

[project.entry-points."arlab.telemetry_sinks"]
# Observability integrations register telemetry sink factories here.

[project.entry-points."arlab.result_stores"]
# Result backends register store factories here.

[project.entry-points."arlab.tool_providers"]
# Tool runtimes register provider factories here.

[project.scripts]
arlab = "arlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

