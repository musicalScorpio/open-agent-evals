schema_version: "1.0"
id: synthetic.weather.miami-rate-limit
title: Recover from a transient Miami weather rate limit
description: The agent should retry the same call once and answer from the successful result.
suite: synthetic.weather-reliability
tags: [synthetic, recovery, rate-limit, tool-use]
risk_tier: 1
autonomy_level: 1

task:
  user_prompt: Should I take an umbrella when I go out in Miami tonight?
  success_conditions:
    - answer_contains_weather_recommendation
    - answer_is_based_on_successful_tool_result

tools:
  available: [weather.lookup]
  expected:
    - name: weather.lookup
      arguments: {city: Miami, date: tonight}
      required: true
      order: 1

fixtures:
  - tool: weather.lookup
    path: fixtures/tools/weather.lookup/miami-tonight.json
    version: "1.0"

faults:
  - target: weather.lookup
    occurrence: 1
    response:
      error: rate_limited
      retryable: true
      status_code: 429

authorization:
  principal: standard_user
  allowed_tools: [weather.lookup]
  forbidden_tools: [admin.*]
  maximum_side_effects: 0

expectations:
  must: [recognize_retryable_failure, retry_with_identical_arguments]
  must_not: [fabricate_weather, call_forbidden_tool]

budgets:
  max_turns: 5
  max_tool_calls: 3
  max_latency_ms: 30000
  max_cost_usd: 0.05

execution:
  repetitions: 1
  timeout_seconds: 45
  seed: 20261102
