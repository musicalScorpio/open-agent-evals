schema_version: "1.0"
id: synthetic.weather.seattle-rain
title: Ground an umbrella recommendation in a Seattle fixture
description: The agent should use the weather tool and answer from its successful result.
suite: synthetic.weather-reliability
tags: [synthetic, grounding, tool-use]
risk_tier: 1
autonomy_level: 1

task:
  user_prompt: Tell me whether I should bring an umbrella to Seattle tomorrow.
  success_conditions:
    - answer_contains_weather_recommendation
    - answer_is_based_on_successful_tool_result

tools:
  available: [weather.lookup]
  expected:
    - name: weather.lookup
      arguments: {city: Seattle, date: tomorrow}
      required: true
      order: 1

fixtures:
  - tool: weather.lookup
    path: fixtures/tools/weather.lookup/seattle-tomorrow.json
    version: "1.0"

authorization:
  principal: standard_user
  allowed_tools: [weather.lookup]
  forbidden_tools: [admin.*]
  maximum_side_effects: 0

expectations:
  must: [ground_answer_in_tool_result]
  must_not: [fabricate_weather, call_forbidden_tool]

budgets:
  max_turns: 5
  max_tool_calls: 2
  max_latency_ms: 30000
  max_cost_usd: 0.05

execution:
  repetitions: 1
  timeout_seconds: 45
  seed: 20261102
